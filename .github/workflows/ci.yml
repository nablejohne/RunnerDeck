name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Hosted runners only (CLAUDE.md): never `runs-on: self-hosted` in this repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # pytest-qt needs a platform plugin; the hosted runner has no desktop session.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv sync --locked
      # Coverage gate on Windows, where the Windows-only process/installer tests also run.
      # --cov-fail-under applies to the combined total, so only core is measured here;
      # app/ui tests still run, they just do not count toward the gate.
      - run: uv run pytest --cov=runnerdeck.core --cov-report=term --cov-fail-under=80

  build:
    # Independent of test: a broken package is worth knowing about even while tests are red.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - name: Build onedir bundle and zip
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build.ps1
      - name: Smoke-test the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist\RunnerDeck'
          $expected = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          Write-Host "pyproject version: $expected"

          foreach ($exe in 'RunnerDeck.exe', 'runnerdeck-helper.exe', 'runnerdeck-cli.exe') {
            if (-not (Test-Path (Join-Path $dist $exe))) { throw "missing $exe in dist\RunnerDeck" }
          }
          $zip = Join-Path $PWD "dist\RunnerDeck-$expected-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }

          # runnerdeck-cli.exe --version must print the package version.
          $out = (& (Join-Path $dist 'runnerdeck-cli.exe') --version | Out-String).Trim()
          Write-Host "runnerdeck-cli --version -> '$out' (exit $LASTEXITCODE)"
          if ($LASTEXITCODE -ne 0) { throw "runnerdeck-cli.exe --version exited $LASTEXITCODE" }
          if ($out -notlike "*$expected*") { throw "runnerdeck-cli.exe --version did not print $expected" }

          # runnerdeck-cli.exe elevated (what the UAC prompt starts) must import pywin32 and
          # answer an unknown operation with a result file.
          $req = Join-Path $env:RUNNER_TEMP 'elevated-smoke.json'
          Set-Content -LiteralPath $req -Value '{"version": 1, "op": "nope"}' -Encoding utf8NoBOM
          & (Join-Path $dist 'runnerdeck-cli.exe') elevated $req
          Write-Host "runnerdeck-cli elevated (unknown op) -> exit $LASTEXITCODE"
          if ($LASTEXITCODE -ne 1) { throw "runnerdeck-cli.exe elevated exited $LASTEXITCODE, expected 1" }
          $res = Join-Path $env:RUNNER_TEMP 'elevated-smoke.result.json'
          if (-not (Select-String -LiteralPath $res -Pattern 'nope' -Quiet)) { throw "no result file from runnerdeck-cli.exe elevated" }
          if (Test-Path -LiteralPath $req) { throw "runnerdeck-cli.exe elevated did not delete its request" }

          # runnerdeck-helper.exe without arguments: usage on stderr, exit code 2.
          $p = Start-Process -FilePath (Join-Path $dist 'runnerdeck-helper.exe') -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput helper-stdout.txt -RedirectStandardError helper-stderr.txt
          Write-Host "runnerdeck-helper (no args) -> exit $($p.ExitCode)"
          Get-Content helper-stderr.txt
          if ($p.ExitCode -ne 2) { throw "runnerdeck-helper.exe exited $($p.ExitCode), expected 2" }
          if (-not (Select-String -Path helper-stderr.txt -Pattern 'usage' -Quiet)) { throw "runnerdeck-helper.exe printed no usage" }

          # RunnerDeck.exe --smoke-test: windowed subsystem, so Start-Process -Wait for the exit code.
          # Redirecting the streams gives the windowed exe real handles for its stderr report.
          $p = Start-Process -FilePath (Join-Path $dist 'RunnerDeck.exe') -ArgumentList '--smoke-test' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput smoke-stdout.txt -RedirectStandardError smoke-stderr.txt
          Write-Host "RunnerDeck.exe --smoke-test -> exit $($p.ExitCode)"
          Get-Content smoke-stdout.txt, smoke-stderr.txt
          if ($p.ExitCode -ne 0) { throw "RunnerDeck.exe --smoke-test exited $($p.ExitCode)" }
      - name: Install, run and uninstall the setup.exe (per-user, silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          $setup = Join-Path $PWD "dist\RunnerDeck-$expected-setup.exe"
          if (-not (Test-Path $setup)) { throw "missing $setup (Inno Setup not found on the runner?)" }
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "setup exited $($p.ExitCode)" }

          $app = Join-Path $env:LOCALAPPDATA 'Programs\RunnerDeck'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\RunnerDeck.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F2B6C1E-5D3A-4B7E-9C21-6A4E2D9F0B13}_is1'
          foreach ($path in "$app\RunnerDeck.exe", "$app\runnerdeck-cli.exe", "$app\runnerdeck-helper.exe", "$app\unins000.exe", $lnk, $key) {
            if (-not (Test-Path $path)) { throw "not installed: $path" }
          }
          $out = (& "$app\runnerdeck-cli.exe" --version | Out-String).Trim()
          Write-Host "installed runnerdeck-cli --version -> '$out'"
          if ($out -notlike "*$expected*") { throw "installed CLI is not $expected" }
          $p = Start-Process -FilePath "$app\RunnerDeck.exe" -ArgumentList '--smoke-test' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput installed-smoke-stdout.txt -RedirectStandardError installed-smoke-stderr.txt
          if ($p.ExitCode -ne 0) { Get-Content installed-smoke-stderr.txt; throw "installed RunnerDeck.exe --smoke-test exited $($p.ExitCode)" }

          # The uninstaller copies itself to %TEMP% and returns at once: poll for the result.
          Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path "$app\RunnerDeck.exe") -or (Test-Path $lnk) -or (Test-Path $key)) {
            if ((Get-Date) -gt $deadline) { throw "uninstall left files or registry entries behind" }
            Start-Sleep -Seconds 1
          }
          Write-Host "installed to $app and uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: RunnerDeck-win-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7
