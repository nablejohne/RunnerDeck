[project]
name = "runnerdeck"
version = "0.1.0"
description = "Windows tray app for managing repo-level GitHub Actions self-hosted runners"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28",
    "keyring>=25",
    "psutil>=7.0",
    "pydantic>=2.9",
    "pyqt-fluent-widgets>=1.7",
    "pyqt5>=5.15.10,<5.16",
    "truststore>=0.10",
]

[project.scripts]
runnerdeck-cli = "runnerdeck.core.cli:main"
runnerdeck-helper = "runnerdeck.core.console_helper:main"

[project.gui-scripts]
runnerdeck = "runnerdeck.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-qt>=4.4",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# The lock is usually produced on macOS; make uv also pick wheels that exist for Windows
# (pyqt5-qt5 stopped publishing win_amd64 wheels after 5.15.2).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runnerdeck"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# M0: spike helpers live in scripts/ and are tested in place; core/ replaces them in M1.
pythonpath = ["scripts"]
addopts = "-ra"
qt_api = "pyqt5"
markers = [
    "integration: needs RUNNERDECK_TEST_PAT / RUNNERDECK_TEST_REPO, skipped otherwise",
]

[tool.coverage.run]
source = ["runnerdeck"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
